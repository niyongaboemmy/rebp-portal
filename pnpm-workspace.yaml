packages:
  - apps/*
  - packages/*

# Supply-chain hygiene: only these dependencies may run install scripts.
allowBuilds:
  "@prisma/engines": true
  prisma: true
  esbuild: true
  "@parcel/watcher": true
  unrs-resolver: true
  "@swc/core": false

# Security fixes in the Prisma CLI's own dependencies (pnpm audit, CI "Dependency audit"):
# GHSA-ggr8-5vv4-36mx (deepmerge-ts < 8), GHSA-3f6p-5ww8-9rcr and the zlib inflate advisory
# (mysql2 <= 3.23.0). Drop each once prisma ships the patched version itself.
overrides:
  deepmerge-ts: 8.0.2
  mysql2: 3.24.6
